	dim temparrPAR

	Dim MyCon
	Dim ADC

	Set MyCon = CreateObject("ADODB.Connection")

	mdbFileName="C:\Program Files\LinkWare\notes.mdb"
	MyConnectString = "DRIVER={Microsoft Access Driver (*.mdb)};DBQ=" & mdbFileName & ";"

	MyCon.Open MyConnectString
	Set ADC = CREATEOBJECT("ADODB.RECORDSET")

'msgbox "select note_content from tbl_notes where note_pkey='" & temparr(1) & "'"

	txtsql.innertext="insert"

	temparr=split(temparrPAR(1),"=")

	if not adc.eof then
		txtsql.innertext="update"

		document.all.Note.value = sNote

		'sSQL = "CREATE PROC testinsert AS insert into tbl_notes values('aa','bb');"
		'CreateStoredProc(sSQL)

		'CreateStoredProc(sSQL)

	end if

	adc.close
	set adc=nothing

End function






function DeleteNote()
	dim temparr
	Dim MyCon
	Dim ADC

	Set MyCon = CreateObject("ADODB.Connection")

	mdbFileName="C:\Program Files\LinkWare\notes.mdb"
	MyConnectString = "DRIVER={Microsoft Access Driver (*.mdb)};DBQ=" & mdbFileName & ";"

	MyCon.Open MyConnectString
	sql = "delete from tbl_notes where note_pkey='" & document.all.txtnotepkey.value & "'"
	MyCon.execute sql
	txtsql.innertext="insert"
	MyCon.close
	set MyCon=nothing
end function

function updatenote()
	dim temparr
	Dim MyCon
	Dim ADC

	Set MyCon = CreateObject("ADODB.Connection")

	mdbFileName="C:\Program Files\LinkWare\notes.mdb"
	MyConnectString = "DRIVER={Microsoft Access Driver (*.mdb)};DBQ=" & mdbFileName & ";"

	MyCon.Open MyConnectString
	if document.all.txtsql.value="update" then
		sql = "update tbl_notes set note_content='" & replace(document.all.Note.InnerHTML & "","'","''") & "' where note_pkey='" & document.all.txtnotepkey.value & "'"
	else
		sql = "insert into tbl_notes (Note_Pkey,Note_Content) values ('" & document.all.txtnotepkey.value & "','" & replace(document.all.Note.InnerHTML & "","'","''") & "')"
	end if
	MyCon.execute sql
	txtsql.innertext="update"
	MyCon.close
	set MyCon=nothing
end function

        sConStr = "PROVIDER=Microsoft.Jet.OLEDB.4.0;Data " _
            & "Source=D:\VB\SearchMDB\notes.mdb"
        set con = CreateObject("ADODB.Connection")
		set cmd = CreateObject("ADODB.Command")
		con.open sconstr
		Con.execute ssql
End Sub
