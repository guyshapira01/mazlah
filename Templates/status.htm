<html topmargin="0">
<head>
	<meta charset="UTF-8">

	<style>
        html, body {
            margin: 0;
            padding: 0;
            font-family:  "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
        }

		.status-strip {
			width: 100%;
			height: 34px;
			box-sizing: border-box;
			display: flex;
			align-items: center;
			background: linear-gradient(to bottom, #ffffff, #f3f7fc);
			border-bottom: 1px solid #c8d7e8;
			border-top: 1px solid #dbe5f0;
			direction: rtl;
		}

		.status-title {
			height: 100%;
			min-width: 270px;
			display: flex;
			align-items: center;
			padding: 0 14px;
			box-sizing: border-box;
			color: #143e73;
			font-size: 13px;
			font-weight: 700;
			border-left: 1px solid #d7e1ed;
			white-space: nowrap;
		}

			.status-title .separator {
				margin: 0 7px;
				color: #8da4bd;
			}

			.status-title .department {
				color: #185aa8;
			}

		.status-tooltip {
			flex: 1;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 12px;
			box-sizing: border-box;
			font-size: 12px;
			color: #334d6e;
			text-align: center;
		}
	</style>
</head>

<body>

	<div class="status-strip">

		<div class="status-title">
			<span>ענף הנדסה</span>
			<span class="separator">•</span>
			<span class="department">מדור פרסום קטלוגים</span>
		</div>

		<div id="textDiv"
			 name="textDiv"
			 class="status-tooltip">
			&nbsp;
		</div>

	</div>

</body>
</html>
