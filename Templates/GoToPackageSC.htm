<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
	<HEAD>
		<TITLE>Go To Package/Pallet</TITLE>
		<META http-equiv=Content-Type content="text/html; charset=windows-1252">
		<META content="MSHTML 6.00.2800.1106" name=GENERATOR>
		<META content=FrontPage.Editor.Document name=ProgId>
		<SCRIPT LANGUAGE="javascript" SRC="../Reports/ReportFunctions.js"></SCRIPT>

	</HEAD>
	<script LANGUAGE="JavaScript">
		//change the window size and position
		window.moveTo(50,100)
		window.resizeTo(370,130)
</script>
	<SCRIPT LANGUAGE="JavaScript">
		var GoToItemExist=0;
		var GoToItemkey;
		var GoToItemParentPkey;
		var CatalogID='163534a1';
		var CatalogName= 'ShipmentConfiguration';
	</SCRIPT>
	<BODY style="background-color:#7F97B9" onkeypress="JavaScript:CheckEnter();" onload="Pack_NUMBER.focus()">
		<TABLE cellSpacing=0 cellPadding=0 width="99%" border=1>
		  <TBODY>
				<TR>
					<TD width="100%">
						<input type="Button" id="GoToPackButton" name="GoToPackButton" value="Go To Package" style="text-align:center;width:200px;height:26px;font-weight:bold;color:black;background-color:#F3F3F3;"
							onClick="javascript:Link1='../generatereport.aspx?Dummy=Packages|Package Name,PHEBDESC|Package ID,PPROP3|Pallet Name,PHEBDESC1|Pallet ID,PPROP221|Pallet Status,STATUSNAME1|No Of Tanks,PPROP651&Catalog=163534a1&amp;Table=T_CAT_PART&amp;XSL=GoToMultipleItem.xsl&amp;PPROP3=(Like)%25' + Pack_NUMBER.value + '%25&amp;PKEYTYPE=41&amp;t_cat_part_father.pprop22=(NE)Batch 0&amp;OrderByFields=t_cat_part.PPROP3,t_cat_part_father.PPROP22'
														w=window.open(Link1,'GoToItemRep','width=950,height=700,top=10,left=10,resizable=yes,toolbar=no,scrollbars=yes');
														GoToItem();"
							onmouseover="JavaScript:this.style.backgroundColor='red'"
							onmouseout="JavaScript:this.style.backgroundColor='#F3F3F3'"/>

						<input type="text" name="Pack_NUMBER" id="Pack_NUMBER" style="width:120px" />
					</TD>
				</TR>
				<TR>
					<TD width="100%">
						<input type="Button" id="GoToPalletButton" name="GoToPalletButton" value="Go To Pallet" style="text-align:center;width:200px;height:26px;font-weight:bold;color:black;background-color:#F3F3F3;"
							onClick="javascript:Link1='../generatereport.aspx?Dummy=Pallets|Pallet Name,PHEBDESC|Pallet ID,PPROP22|Pallet Status,STATUSNAME|No Of Tanks,PPROP65&Catalog=163534a1&amp;Table=T_CAT_PART&amp;XSL=GoToMultipleItem.xsl&amp;PPROP22=(Like)%25' + Pallet_NUMBER.value + '%25&amp;PKEYTYPE=54&amp;OrderByFields=t_cat_part.PPROP22'
														w=window.open(Link1,'GoToItemRep','width=750,height=700,top=10,left=10,resizable=yes,toolbar=no,scrollbars=yes');
														GoToItem();"
							onmouseover="JavaScript:this.style.backgroundColor='red'"
							onmouseout="JavaScript:this.style.backgroundColor='#F3F3F3'"/>

						<input type="text" name="Pallet_NUMBER" id="Pallet_NUMBER" style="width:120px" />
					</TD>
				</TR>
			</TBODY>
		</TABLE>
		<script language="JavaScript">
			function GoToItem()	{
		//	alert(GoToItemExist);
				if(GoToItemExist==0)	{
					funcCall  = 'GoToItem()';
					setTimeout(funcCall,100);
				}

				else
					if(GoToItemExist==1)	{
					//	alert(GoToItemkey);
				//		alert(GoToItemParentPkey);
						if (getParamFromUrl('CallFrom')=='')	{
							// call from the Portal
							w=window.open('../OnlineSearchRedirect.aspx?Pkey=' + GoToItemkey + '&amp;pparentkey=' + GoToItemParentPkey + '&amp;pkeycatalog=163534a1','Shipment Comfiguration','location=no,menubar=yes,toolbar=yes,status=yes,scrollbars=yes,resizable=yes,top=0,left=0,width=screen.width,height=screen.height');
							w.focus();
						}
						else	{

							// Call from the Tree
							window.opener.top.frames('Index').LinkSwitch(GoToItemkey,GoToItemParentPkey);
							window.opener.focus();
						}
						GoToItemExist=0;
						window.close();
				}
				//document.location.href='../OnlineSearchRedirect.aspx?Pkey=' + GoToItemkey + '&amp;pparentkey=' + GoToItemParentPkey + '&amp;pkeycatalog=163534a1';
				GoToItemExist=0;
			}

			function CheckEnter()	{
				if (window.event.keyCode==13)	{
					if (Pack_NUMBER.value != '' && Pallet_NUMBER.value != '')
						void(0);
					else	{
						if (Pack_NUMBER.value != '')	{
							GoToPackButton.click();
						}
						if (Pallet_NUMBER.value != '')	{
							GoToPalletButton.click();
						}
					}
				}
			}

		</script>
	</BODY>
</HTML>
